name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Check Docker secrets
        run: |
          echo "Username exists: ${{ secrets.DOCKER_USERNAME != '' }}"
          echo "Password exists: ${{ secrets.DOCKER_PASSWORD != '' }}"


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Docker Image
        run: |
          docker build -t amirhosseinhaydari/hello-cicd:latest .


      - name: Push Docker Image
        run: |
          docker push amirhosseinhaydari/hello-cicd:latest