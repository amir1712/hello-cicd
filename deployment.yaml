apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-cicd

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-cicd

  template:
    metadata:
      labels:
        app: hello-cicd

    spec:
      containers:
      - name: hello-cicd

        image: hello-cicd:v1

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5000